<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Toma A-45">

<title>Toma de datos de terreno A-45</title>
<style>
:root{--p:#742774;--p2:#8e3b8e;--bg:#f4f5f7;--card:#fff;--line:#dfe2e7;--text:#202124;--muted:#697386;--green:#197a3d;--red:#b42318}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
button,input{font:inherit}
button{border:0;border-radius:12px;padding:13px 16px;font-weight:700;cursor:pointer}
.primary{background:var(--p);color:white}.secondary{background:#e9ebef;color:#333}.danger{background:#b42318;color:white}
header{height:62px;background:var(--p);color:white;padding:10px 16px;position:relative;z-index:20;box-shadow:0 2px 8px #0002;display:flex;align-items:center}
.title{font-size:20px;font-weight:800;line-height:1.1}.sub{font-size:11px;opacity:.9;margin-top:3px}
main{height:calc(100vh - 62px);position:relative}
.screen{display:none;width:100%;height:100%}.screen.active{display:block}
.start-wrap{height:100%;overflow:auto;padding:18px 14px 30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:14px;box-shadow:0 2px 8px #0000000a}
.info{display:flex;gap:8px;flex-wrap:wrap;font-size:13px}.pill{background:#f0edf2;padding:8px 10px;border-radius:20px}
.start-title{font-size:24px;margin:0 0 10px}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px;color:#4d174d}
.field input{width:100%;padding:14px;border:1px solid #c7ccd4;border-radius:11px;font-size:20px;background:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hint{font-size:12px;color:var(--muted);line-height:1.45}
.session{height:100%;display:flex;flex-direction:column}
.session-top{background:white;border-bottom:1px solid var(--line);padding:9px 12px;z-index:10}
.top-row{display:flex;align-items:center;gap:8px}.top-row b{flex:1;text-align:center}
.progress{height:6px;background:#e3e5e8;border-radius:20px;overflow:hidden;margin-top:8px}.bar{height:100%;background:var(--p);width:0;transition:width .2s}
.counter{text-align:center;font-size:11px;color:var(--muted);margin-top:5px}
.swipe-area{flex:1;min-height:0;position:relative;touch-action:pan-y;overflow:hidden}
.slide{height:100%;overflow:auto;padding:14px 14px 30px;display:flex;align-items:flex-start;justify-content:center}
.measure-card{width:100%;max-width:650px;background:white;border:1px solid var(--line);border-radius:20px;padding:22px 18px;box-shadow:0 4px 16px #00000012;min-height:72%}
.section-badge{display:inline-block;background:#eee9f0;color:#4d174d;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:800;margin-bottom:18px}
.tag{font-size:30px;font-weight:900;letter-spacing:.2px}.equip{font-size:18px;margin-top:8px;color:#30343a}.param{font-size:16px;color:#555f6d;margin-top:10px}
.range{font-size:13px;color:#697386;margin-top:14px;padding:10px;background:#f7f7f8;border-radius:10px}
.previous-value{font-size:12px;color:#8a8f98;margin:7px 0 10px;text-align:center}.previous-value b{font-weight:700;color:#6f747d}.measure-input{margin-top:22px}.measure-input label{display:block;font-size:14px;font-weight:800;color:#4d174d;margin-bottom:8px}
.measure-input input{width:100%;height:66px;border:2px solid #c7ccd4;border-radius:14px;padding:8px 14px;font-size:32px;text-align:center;background:#fff;outline:none}
.measure-input input:focus{border-color:var(--p)}
.state{text-align:center;margin-top:9px;font-size:13px;font-weight:900}.normal{color:var(--green)}.out{color:var(--red)}.pending{color:#727b87}
.nav-hint{text-align:center;color:#8a919b;font-size:12px;margin-top:18px}
.nav-buttons{display:flex;gap:10px;margin-top:18px}.nav-buttons button{flex:1}
.footer-actions{padding:8px 12px;background:white;border-top:1px solid var(--line);display:flex;gap:8px}.footer-actions button{flex:1}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.show{opacity:1}
.hist-wrap{height:100%;overflow:auto;padding:14px}.hist-table{background:white;border-radius:14px;overflow:auto;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:8px;border-bottom:1px solid #eee;white-space:nowrap}
@media(max-width:430px){.field-grid{grid-template-columns:1fr 1fr}.tag{font-size:28px}.measure-card{padding:20px 16px}.measure-input input{height:62px;font-size:30px}}
</style>

<body>
<header><div><div class="title">Toma de datos de terreno A-45</div><div class="sub">Registro de mediciones en terreno</div></div></header>
<main>
<section id="inicio" class="screen active">
<div class="start-wrap">
<div class="card">
<h1 class="start-title">Iniciar</h1>
<div class="info"><div class="pill">📅 <b id="fecha"></b></div><div class="pill">🕐 <b id="hora"></b></div><div class="pill">🔄 <b id="turno"></b></div></div>
<div class="field-grid">
<div class="field"><label for="purga">Purga (%)</label><input id="purga" type="number" step="any" inputmode="decimal" placeholder="0"></div>
<div class="field"><label for="filtro">Filtro (mbar)</label><input id="filtro" type="number" step="any" inputmode="decimal" placeholder="0"></div>
</div>
<p class="hint">Ingresa estos dos valores al inicio. Luego cada elemento aparecerá individualmente. Al registrar un valor, la aplicación avanzará automáticamente al siguiente elemento.</p>
<div class="actions">
<button class="primary" onclick="iniciar()">Iniciar</button>
<button class="secondary" onclick="historial()">Historial</button>
<button class="secondary" onclick="exportar()">Exportar CSV</button>
</div>
</div>
</div>
</section>

<section id="ronda" class="screen">
<div class="session">
<div class="session-top">
<div class="top-row">
<button class="secondary" onclick="inicio()">←</button>
<b id="contexto"></b>
<button class="primary" onclick="finalizar()">Finalizar</button>
</div>
<div class="progress"><div id="bar" class="bar"></div></div>
<div id="progreso" class="counter"></div>
</div>
<div id="swipeArea" class="swipe-area">
<div id="slide" class="slide"></div>
</div>
<div class="footer-actions">
<button class="secondary" onclick="anterior()">← Anterior</button>
<button class="secondary" onclick="siguiente()">Siguiente →</button>
</div>
</div>
</section>

<section id="hist" class="screen">
<div class="hist-wrap">
<div class="card"><div class="actions" style="margin-top:0"><button class="secondary" onclick="inicio()">← Inicio</button><button class="secondary" onclick="exportar()">Exportar CSV</button><button class="danger" onclick="borrar()">Borrar</button></div></div>
<div class="card"><input id="buscarHist" style="width:100%;padding:12px;border:1px solid #c7ccd4;border-radius:10px" placeholder="Buscar..." oninput="renderHist()"></div>
<div class="hist-table" id="tabla"></div>
</div>
</section>
</main>

let ronda=[], indice=0, inicioSesion=null, purgaSesion='', filtroSesion='', autoTimer=null;

function $(x){return document.getElementById(x)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function now(){const d=new Date();return {d,fecha:d.toLocaleDateString('es-CL'),hora:d.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}),turno:d.getHours()>=8&&d.getHours()<20?'Día':'Noche'}}
function actualizarInicio(){const n=now();$('fecha').textContent=n.fecha;$('hora').textContent=n.hora;$('turno').textContent=n.turno}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');window.scrollTo(0,0)}
function inicio(){show('inicio');actualizarInicio()}
function iniciar(){
  const n=now(); purgaSesion=$('purga').value===''?'':Number($('purga').value); filtroSesion=$('filtro').value===''?'':Number($('filtro').value);
  ronda=PUNTOS.map(p=>({...p,lectura:''})); indice=0; inicioSesion=n;
  $('contexto').textContent=`${n.fecha} · ${n.hora} · Turno ${n.turno}`;
  show('ronda'); renderElemento(); progreso(); setTimeout(focusInput,120);
}
function estado(p){
  if(p.lectura===''||p.lectura==null||Number.isNaN(Number(p.lectura)))return 'PENDIENTE';
  if(p.Mínimo==null||p.Máximo==null)return 'REGISTRADO';
  return Number(p.lectura)>=Number(p.Mínimo)&&Number(p.lectura)<=Number(p.Máximo)?'NORMAL':'FUERA DE RANGO';
}
function rangoTexto(p){
  if(p.Mínimo!=null&&p.Máximo!=null)return `Rango: ${p.Mínimo} – ${p.Máximo} ${p.Unidad}`;
  if(p.Mínimo!=null)return `Mínimo: ${p.Mínimo} ${p.Unidad}`;
  if(p.Máximo!=null)return `Máximo: ${p.Máximo} ${p.Unidad}`;
  return '';
}
function ultimoRegistroElemento(p){
  const h=JSON.parse(localStorage.getItem('ronda_operacional_registros')||'[]');
  for(let i=h.length-1;i>=0;i--){
    if(String(h[i].PuntoID)===String(p.ID)) return h[i].Valor;
  }
  return '';
}

function renderElemento(){
  if(!ronda.length)return;
  const p=ronda[indice], st=estado(p), cls=st==='NORMAL'?'normal':st==='FUERA DE RANGO'?'out':'pending';
  $('slide').innerHTML=`<div class="measure-card">
    <div class="section-badge">${esc(p.Área)}</div>
    <div class="tag">${esc(p.TAG)}</div>
    <div class="equip"><b>Equipo:</b> ${esc(p.Equipo)}</div>
    <div class="param"><b>Parámetro:</b> ${esc(p.Parámetro)} · <b>Unidad:</b> ${esc(p.Unidad)}</div>
    ${rangoTexto(p)?`<div class="range">${esc(rangoTexto(p))}</div>`:''}
    <div class="measure-input">
      <label for="lectura">Valor de medición</label>
      <div class="previous-value">Último registro: <b>${esc(ultimoRegistroElemento(p) || '—')}</b></div>
      <input id="lectura" type="number" step="any" inputmode="decimal" pattern="[0-9]*" enterkeyhint="next" autocomplete="off" autocorrect="off" value="${esc(p.lectura)}" placeholder="Ingresar valor"
             onkeydown="tecla(event)" onchange="guardarYAvanzar(this.value)" oninput="actualizarEstadoEnVivo(this.value)">
      <div id="estadoActual" class="state ${cls}">${st}</div>
    </div>
    <div class="nav-hint">Desliza ← o → para cambiar de elemento sin registrar un valor.</div>
    <div class="nav-buttons"><button class="secondary" onclick="anterior()">← Anterior</button><button class="primary" onclick="siguiente()">Siguiente →</button></div>
  </div>`;
  $('slide').scrollTop=0;
  progreso();
}
function actualizarEstadoEnVivo(v){
  const p=ronda[indice], old=p.lectura; p.lectura=v===''?'':Number(v);
  const st=estado(p), el=$('estadoActual'); if(el){el.textContent=st;el.className='state '+(st==='NORMAL'?'normal':st==='FUERA DE RANGO'?'out':'pending')}
  p.lectura=old;
}
function guardarYAvanzar(v){
  const p=ronda[indice]; p.lectura=v===''?'':Number(v); progreso();
  if(v!=='' && indice<ronda.length-1){clearTimeout(autoTimer);autoTimer=setTimeout(()=>{indice++;renderElemento();focusInput()},180)}
}
function tecla(e){if(e.key==='Enter'){e.preventDefault();guardarYAvanzar(e.target.value)}}
function focusInput(){const el=$('lectura');if(el){el.focus();el.select()}}
function siguiente(){if(indice<ronda.length-1){indice++;renderElemento();focusInput()}else{toast('Último elemento de la ronda')}} 
function anterior(){if(indice>0){indice--;renderElemento();focusInput()}else{toast('Primer elemento de la ronda')}}
function progreso(){
  const total=ronda.length, completos=ronda.filter(p=>estado(p)!=='PENDIENTE').length, fuera=ronda.filter(p=>estado(p)==='FUERA DE RANGO').length;
  $('progreso').textContent=`Elemento ${indice+1} de ${total} · ${completos} registrados · ${fuera} fuera de rango`;
  $('bar').style.width=(total?completos/total*100:0)+'%';
}
function finalizar(){
  const n=now(), completos=ronda.filter(p=>estado(p)!=='PENDIENTE');
  if(!completos.length){alert('No hay mediciones ingresadas en esta sesión.');return}
  const hist=JSON.parse(localStorage.getItem('ronda_operacional_registros')||'[]');
  const registros=completos.map(p=>({ID:crypto.randomUUID?crypto.randomUUID():String(Date.now()+p.ID),Fecha:n.fecha,Hora:n.hora,Turno:n.turno,Purga:purgaSesion,Filtro:filtroSesion,PuntoID:p.ID,Área:p.Área,Equipo:p.Equipo,TAG:p.TAG,Parámetro:p.Parámetro,Unidad:p.Unidad,Valor:p.lectura,Estado:estado(p)}));
  localStorage.setItem('ronda_operacional_registros',JSON.stringify(hist.concat(registros)));
  alert(`Sesión finalizada. Se guardaron ${registros.length} mediciones.`);
  inicio();
}
function historial(){show('hist');renderHist()}
function renderHist(){
  const q=$('buscarHist').value.toLowerCase().trim();
  let h=JSON.parse(localStorage.getItem('ronda_operacional_registros')||'[]').reverse();
  h=h.filter(r=>!q||Object.values(r).some(v=>String(v??'').toLowerCase().includes(q)));
  if(!h.length){$('tabla').innerHTML='<div style="padding:25px;text-align:center;color:#697386">No hay registros.</div>';return}
  const c=['Fecha','Hora','Turno','Purga','Filtro','Área','Equipo','TAG','Parámetro','Valor','Unidad','Estado'];
  $('tabla').innerHTML='<table><thead><tr>'+c.map(x=>`<th>${x}</th>`).join('')+'</tr></thead><tbody>'+
  h.map(r=>'<tr>'+c.map(x=>`<td>${esc(r[x])}</td>`).join('')+'</tr>').join('')+'</tbody></table>';
}
function borrar(){if(confirm('¿Borrar todo el historial de este navegador?')){localStorage.removeItem('ronda_operacional_registros');renderHist()}}
function exportar(){
  const h=JSON.parse(localStorage.getItem('ronda_operacional_registros')||'[]');
  if(!h.length){alert('No hay registros para exportar.');return}
  const c=['ID','Fecha','Hora','Turno','Purga','Filtro','PuntoID','Área','Equipo','TAG','Parámetro','Unidad','Valor','Estado'];
  const csv=[c,...h.map(r=>c.map(x=>r[x]??''))].map(a=>a.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\\n');
  const b=new Blob(['\\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Toma_de_datos_A45_Registros.csv';a.click();URL.revokeObjectURL(a.href);
}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400)}

let touchStartX=0,touchStartY=0,touchStartTime=0;
$('swipeArea').addEventListener('touchstart',e=>{const t=e.changedTouches[0];touchStartX=t.clientX;touchStartY=t.clientY;touchStartTime=Date.now()},{passive:true});
$('swipeArea').addEventListener('touchend',e=>{
  const t=e.changedTouches[0],dx=t.clientX-touchStartX,dy=t.clientY-touchStartY,dt=Date.now()-touchStartTime;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.25&&dt<700){if(dx<0)siguiente();else anterior()}
},{passive:true});
actualizarInicio();setInterval(actualizarInicio,30000);
